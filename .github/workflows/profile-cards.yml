# Generates the contribution snake, stats cards and activity graph for the profile
# README and publishes them to the "output" branch, where the README reads them.
name: Generate profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # fail_on_error stops the run instead of publishing a "Something went wrong"
      # card, so the last good cards stay on the output branch.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&bg_color=18132A&title_color=E0BDAB&icon_color=B5A8E6&text_color=DAD3D2&ring_color=7C67CA"
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=18132A&title_color=E0BDAB&text_color=DAD3D2"
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate activity graph
        run: python3 .github/scripts/activity_graph.py dist/activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # Runs after the other cards: this Docker action writes as root, so if it
      # created dist/ first, the stats action could not write into it.
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # colors match the README theme (Ink / Violet / Lavender / Peach)
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0E0E0E&color_dots=#EBEDF0,#D9D2F3,#B5A8E6,#7C67CA,#3E2F74
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E0BDAB&color_dots=#161B22,#2B224F,#3E2F74,#7C67CA,#B5A8E6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
