# ┌─────────────────────────────────────────────────────────────┐
# │  Save this as:  .github/workflows/snake.yml                  │
# │  in your  chittoralovesh/chittoralovesh  repo.               │
# │  It auto-generates the contribution-snake SVG every 12 hrs   │
# │  and pushes it to the "output" branch, where the README      │
# │  image link reads it from. No other setup needed.            │
# └─────────────────────────────────────────────────────────────┘
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # colors match the avatar palette in the README (Ink / Violet / Lavender / Peach)
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0E0E0E&color_dots=#EBEDF0,#D9D2F3,#B5A8E6,#7C67CA,#3E2F74
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E0BDAB&color_dots=#161B22,#2B224F,#3E2F74,#7C67CA,#B5A8E6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
